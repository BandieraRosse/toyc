# 通用玩法参数：修改后重启生效，无需重新编译。
# 全部为整数。ms = 毫秒；RFU = 世界单位，512 RFU = 1 米。
# 未列出的参数使用内置默认值；范围见玩法配置指南。

# 波次导演：首波等待、波间休息、预告、总波数、规模百分比及每波刷怪时长。
wave_first_delay_ms = 512000
wave_pause_ms = 512000
wave_announce_ms = 2000
wave_max = 10
wave_scale_percent = 400
wave_spawn_duration_ms = 20000

# 基地核心：最大/出生生命；每恢复 1 HP 的间隔。
base_hp = 500
base_regen_ms = 1000

# 推搡：有效距离、推开距离、普通敌人和 Charger 的僵直时长。
shove_range_rfu = 900
shove_push_rfu = 500
shove_stun_ms = 1500
charger_shove_stun_ms = 400

# 药丸：面向友军治疗的有效距离，独立于推搡范围。
pill_heal_range_rfu = 900

# 近战：有效距离及每次伤害。
melee_range_rfu = 900
melee_damage = 30

# 投掷：速度、重力、反弹后的速度保留千分比、最大反弹次数、碰撞半径。
throw_speed_rfu_per_second = 15200
throw_gravity_rfu_per_second2 = 6000
throw_bounce_per_mille = 700
throw_max_bounces = 3
throw_collision_radius_rfu = 55

# 炸弹：伤害、爆炸半径及落地后引信时长，0 表示落地立即爆炸。
bomb_damage = 30
bomb_radius_rfu = 3000
bomb_fuse_ms = 4000

# 燃烧瓶：燃烧范围、燃烧持续/伤害间隔和每次伤害。
molotov_burn_radius_rfu = 2500
molotov_burn_ms = 8000
molotov_tick_ms = 1000
molotov_damage = 12

# 回避：按基础伤害等额吸收，受击后等待指定时间再恢复储备。
evasion_recovery_delay_ms = 3000
