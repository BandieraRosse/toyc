# 玩家移动配置：修改后重启游戏，无需重新编译。
# 米制速度最多三位小数；时间使用整数毫秒。# 后为注释。
# 未列出的参数使用内置默认值；拼错、重复或越界会报错。

move_speed_mps = 17.812        # 基础跑速，m/s；范围 0.5～30，仍乘移动技能倍率
ground_accel_mps2 = 60        # 起步加速度，m/s²；范围 1～300
ground_brake_mps2 = 75        # 松键减速度，m/s²；范围 1～300
turn_accel_mps2 = 90          # 反向输入加速度，m/s²；范围 1～300
air_accel_mps2 = 10           # 空中微调加速度，m/s²；范围 0～100，0 禁用微调

jump_speed_mps = 7.5         # 垂直起跳速度，m/s；范围 1～20
gravity_mps2 = 21.094         # 普通玩家跳跃/掉落重力，m/s²；范围 4～100
fall_terminal_mps = 40        # 普通玩家最大下落速度，m/s；范围 1～100
coyote_ms = 100               # 离边起跳宽限，ms；范围 0～250，0 禁用
jump_buffer_ms = 100          # 落地前跳跃输入缓冲，ms；范围 0～250，0 禁用

# 本配置对应约 17.81m/s 跑速、1.40m 跳高、0.73s 滞空、13.06m 满速平地跳远。
# 速度/重力沿用每个 60Hz 步的整数 RFU 精度；时间向上取整到逻辑步。
# 本文件只调整玩家运动；队友、感染者和特殊攻击击飞继续使用各自规则。
